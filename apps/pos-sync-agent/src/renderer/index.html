<!doctype html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Cacaduu Connector</title>
  </head>
  <body>
    <main>
      <header>
        <h1>Cacaduu Connector</h1>
        <select id="lang" aria-label="Language">
          <option value="sk">Slovenčina</option>
          <option value="hu">Magyar</option>
          <option value="en">English</option>
        </select>
      </header>
      <p data-t="intro"></p>
      <section>
        <h2 data-t="status"></h2>
        <p id="status" role="status" aria-live="polite"></p>
        <p id="details"></p>
        <div class="buttons">
          <button id="inspect" data-t="inspect"></button
          ><button id="sync" data-t="sync"></button
          ><button id="pause" data-t="pause"></button
          ><button id="clear" data-t="disconnect"></button>
        </div>
      </section>
      <form id="settings">
        <h2 data-t="settings"></h2>
        <label
          ><span data-t="backend"></span
          ><input
            id="backend"
            type="url"
            required
            placeholder="https://project.supabase.co" /></label
        ><label
          ><span data-t="source"></span
          ><select id="kind">
            <option value="file" data-t="file"></option>
            <option value="rest" data-t="rest"></option></select></label
        ><button type="button" id="choose" data-t="choose"></button>
        <p data-t="complete"></p>
        <label
          ><span data-t="count"></span
          ><input
            id="count"
            type="number"
            min="1"
            max="100000"
            required /></label
        ><label
          ><span data-t="interval"></span
          ><input
            id="interval"
            type="number"
            min="1"
            max="1440"
            value="15"
            required
        /></label>
        <fieldset>
          <legend data-t="mapping"></legend>
          <div id="mapping"></div>
        </fieldset>
        <fieldset id="rest">
          <legend data-t="rest"></legend>
          <p data-t="restNote"></p>
          <label>URL<input id="restUrl" type="url" /></label
          ><label
            ><span data-t="token"></span
            ><input id="restToken" type="password" autocomplete="off" /></label
          ><label
            ><span data-t="itemsPath"></span
            ><input id="itemsPath" value="items" /></label
          ><label
            ><span data-t="totalPath"></span
            ><input id="totalPath" value="total" /></label
          ><label
            ><span data-t="timePath"></span
            ><input id="timePath" value="observedAt" /></label
          ><label
            ><span data-t="pageParam"></span
            ><input id="pageParam" value="page" /></label
          ><label
            ><span data-t="sizeParam"></span
            ><input id="sizeParam" value="pageSize" /></label
          ><label
            ><span data-t="size"></span
            ><input id="size" type="number" min="1" max="10000" value="100"
          /></label>
        </fieldset>
        <button data-t="save"></button>
      </form>
      <section>
        <h2 data-t="pair"></h2>
        <p data-t="apiNote"></p>
        <form id="pair">
          <label
            ><span data-t="code"></span
            ><input id="code" autocomplete="off" required /></label
          ><button data-t="pair"></button>
        </form>
        <label class="check"
          ><input id="startup" type="checkbox" /><span data-t="startup"></span
        ></label>
      </section>
      <p data-t="limitations"></p>
    </main>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
